name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contractor_portal_pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contractor_portal_pytest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      FLASK_APP: wsgi.py
      FLASK_ENV: testing
      FLASK_DEBUG: "0"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/contractor_portal_pytest
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/contractor_portal_pytest
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      JWT_SECRET_KEY: ci-test-jwt-secret-key-at-least-32-chars-long
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      LOG_FORMAT: plain

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: python -m flask db upgrade

      - name: Run backend tests
        run: python -m pytest -rs

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
